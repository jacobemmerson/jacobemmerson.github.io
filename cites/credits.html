<!doctype html>
<html lang="en">
    <head>
        <style>
            body {background-color: #171C24;}
            .credits {
                height: 95vh;
                display: flex;
                justify-content: center;
                align-items: center;
                text-align: center;
                flex-direction: column;
                gap: 0.5em;
                color: #9AA6B8;
            }
            a {text-decoration: none; color: inherit;}
            a:hover {font-weight: bold;}
        </style>
    </head>
    <body>
        <div class="credits">
            <h4>credits</h4>
            <a href="https://github.com/SebastinSanty/minimal-research-theme" target="_blank">source repo</a>
            <a href="https://fonts.google.com/specimen/Inter" target="_blank">main font</a>
            <a href="https://www.iconpacks.net/free-icon/sun-3337.html" target="_blank">theme icon</a>
            <a id="seen" href="https://candiewrapper.art" target="_blank">easter egg artist</a>
            <span id="unseen" style="display:none">did you find the easter egg?</span>
        </div>
        <script>
            let seen = localStorage.getItem("seenConfetti") === "true";
            document.getElementById("seen").style.display = seen ? "inline" : "none";
            document.getElementById("unseen").style.display = seen ? "none" : "inline";
        </script>
    </body>
</html>
